name: Bug / 安装或运行问题
description: 报告 TestFlight、安装、连接、Preview、执行或回读中的可复现问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请只提供可公开的、已脱敏的信息。

        **不要粘贴墨墨 API Token、Authorization/Cookie、账号标识、私人词库/例句或其他个人学习数据。**

  - type: dropdown
    id: build
    attributes:
      label: 小黑鸟伴侣版本
      options:
        - TestFlight 1.0 (3)
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: iPhone 型号
      placeholder: 例如 iPhone 17 Pro Max
    validations:
      required: true

  - type: input
    id: ios
    attributes:
      label: iOS 版本
      placeholder: 例如 iOS 26.0
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题发生在哪一部分？
      options:
        - TestFlight / 安装 / 启动
        - 墨墨 Token / 连接
        - 自建释义
        - 例句 / 短语
        - Preview
        - 执行 / 写入 / 回读
        - 历史记录
        - Codex Recipe 1
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写到另一个人可以按步骤重现。不要包含 Token 或私人学习内容。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你原本预期发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 可公开的截图 / 报错 / 补充信息（可选）
      description: 上传前请遮掉 Token、账号信息和私人学习数据。不要上传原始 API 响应。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认本 Issue 不包含墨墨 Token、Authorization/Cookie、账号标识或私人学习数据。
          required: true
