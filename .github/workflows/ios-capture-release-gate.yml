name: iOS capture release gate

# COST_TRIPWIRE_PUBLIC_REPO: this macOS PR gate is economical because the repository is public.
# If the repository becomes private, re-route routine macOS execution to manual/tag/release before continuing.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/verify_ios_capture_release_gate.sh'
      - '.github/workflows/ios-capture-release-gate.yml'

permissions:
  contents: read

concurrency:
  group: ios-capture-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-release-gate:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Verify capture release gate
        run: bash scripts/verify_ios_capture_release_gate.sh
